name: Backend CI/CD

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  workflow_dispatch:

jobs:
  backend-checks:
    name: Backend Verification
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: test
      MONGODB_DATABASE: oppam_therapy_test
      PAYMENT_PROVIDER: mock
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: "latest"

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies with uv
        run: uv sync --dev --frozen

      - name: Lint with Ruff
        run: uv run ruff check app tests

      - name: Type check with MyPy
        run: uv run mypy app tests

      - name: Run Pytest suite
        run: uv run pytest tests/ -v

  build-and-deploy:
    name: Build & Deploy Backend
    needs: backend-checks
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    env:
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      GCP_REGION: ${{ secrets.GCP_REGION }}
      CLOUD_RUN_BACKEND_SERVICE_NAME: ${{ secrets.CLOUD_RUN_BACKEND_SERVICE_NAME }}
      GCP_ARTIFACT_REGISTRY: ${{ secrets.GCP_ARTIFACT_REGISTRY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup gcloud CLI
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Configure Docker authentication
        run: gcloud auth configure-docker ${{ secrets.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Build and Push Docker image
        run: |
          IMAGE_BASE="${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ secrets.GCP_ARTIFACT_REGISTRY }}/${{ secrets.CLOUD_RUN_BACKEND_SERVICE_NAME }}"
          IMAGE_TAG="${IMAGE_BASE}:${{ github.sha }}"
          IMAGE_LATEST="${IMAGE_BASE}:latest"

          docker build \
            -t "$IMAGE_TAG" \
            -t "$IMAGE_LATEST" \
            ./backend

          docker push --all-tags "$IMAGE_BASE"

      - name: Deploy to Cloud Run
        run: |
          DEPLOY_FLAGS=(
            "--image=${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ secrets.GCP_ARTIFACT_REGISTRY }}/${{ secrets.CLOUD_RUN_BACKEND_SERVICE_NAME }}:${{ github.sha }}"
            "--region=${{ secrets.GCP_REGION }}"
            "--platform=managed"
            "--memory=1Gi"
            "--allow-unauthenticated"
          )

          if [ -n "${{ secrets.BACKEND_ENV }}" ]; then
            cat << 'EOF' > parse_env.py
          import yaml

          env_vars = {}
          with open("backend.env") as f:
              for line in f:
                  line = line.strip()
                  if not line or line.startswith("#") or "=" not in line:
                      continue
                  key, val = line.split("=", 1)
                  key = key.strip()
                  val = val.strip("\"'")
                  env_vars[key] = val

          env_vars.pop("PORT", None)

          with open("env.yaml", "w") as f:
              yaml.dump(env_vars, f)
          EOF

            echo "${{ secrets.BACKEND_ENV }}" > backend.env
            python3 parse_env.py
            DEPLOY_FLAGS+=("--env-vars-file=env.yaml")
          fi

          gcloud run deploy ${{ secrets.CLOUD_RUN_BACKEND_SERVICE_NAME }} "${DEPLOY_FLAGS[@]}"
